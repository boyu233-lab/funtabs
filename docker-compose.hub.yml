# ============================================================
# Xtab 部署文件 —— Docker Hub 镜像版（NAS 上不编译，直接拉取）
#
# 用法：放到 NAS 的 /volume1/docker/xtab/ 目录，然后
#         docker compose -f docker-compose.hub.yml up -d
# ============================================================

name: xtab

services:
  xtab:
    # 镜像地址：https://hub.docker.com/r/boyu233/xtab
    image: docker.io/boyu233/xtab:latest
    container_name: xtab
    restart: unless-stopped

    ports:
      # 默认监听所有网卡，Lucky 用 http://127.0.0.1:8099 或 NAS 内网 IP 回源
      - "8099:8099"
      # 若 Lucky 跑在宿主机（host 网络），改成下面这行更安全：
      # 外部无法绕过反代直连后端
      # - "127.0.0.1:8099:8099"

    environment:
      - PORT=8099
      - DATA_DIR=/app/data

      # 主数据文件格式：yaml（默认，人工可编辑，推荐）/ json（旧版兼容）
      # 首次启动若目标格式文件不存在，会自动从另一种格式转换过来，原文件保留
      - DATA_FORMAT=yaml

      # 【必填】公网访问必须设置，与网页右下角「云图标 → 自托管设置」填的一致
      # 生成：openssl rand -hex 32
      - API_TOKEN=请替换成随机长字符串

      # 【必填】前面挂了 Lucky / nginx / Cloudflare Tunnel 时必须为 1。
      # 否则服务端看到的来源 IP 全是反代地址，限流会误伤正常访问
      - TRUST_PROXY=1

      # 单 IP 每 5 分钟请求上限，0 表示不限
      - RATE_LIMIT=600

      # 热搜上游：默认 60s 公共实例（限流严格，仅适合轻度使用）。
      # 启用下方可选的 60s 自托管服务后，改为 http://60s:4399/v2 即可无限额度
      - HOT_API_BASE=https://60s.viki.moe/v2

      # 时区，影响日志与壁纸日期
      - TZ=Asia/Shanghai

    volumes:
      # —— 所有数据都存在这里，备份就是把整个 data 目录打包 ——
      # 容器内结构：
      #   /app/data/funtabs.yaml    书签/配置的真相源（默认 YAML，原子写，另有 .bak）
      #   /app/data/funtabs.json    DATA_FORMAT=json 时使用（首次启动会自动互转）
      #   /app/data/uploads/        上传的图片、壁纸（只存文件，不存 base64）
      #
      # 建议首次启动前先创建（避免 Docker 以 root 自动创建导致权限问题）：
      #   mkdir -p /volume1/docker/xtab/data
      - /volume1/docker/xtab/data:/app/data
      # 也可以改成相对路径（相对本文件所在目录，Docker 会自动创建）：
      # - ./data:/app/data

    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8099/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # —— 可选：自托管 60s 热搜 API（开源，viki.moe 公共实例限流严格时启用）——
  # 启用后把上面的 HOT_API_BASE 改为 http://60s:4399/v2
  # 60s:
  #   image: vikiboss/60s:latest
  #   container_name: xtab-60s
  #   restart: unless-stopped
  #   expose:
  #     - "4399"
