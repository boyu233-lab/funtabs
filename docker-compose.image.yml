# 从镜像仓库部署（不本地构建）
#
# 用法：
#   1. 复制一份为 docker-compose.yml，或直接用 -f 指定本文件
#   2. 在同目录建 .env 写一行 IMAGE=你的镜像地址，例如：
#        Docker Hub      IMAGE=docker.io/<你的用户名>/xtab:latest
#        阿里云 ACR      IMAGE=registry.cn-hangzhou.aliyuncs.com/<命名空间>/xtab:latest
#   3. docker compose -f docker-compose.image.yml up -d
#
# 更新时：docker compose -f docker-compose.image.yml pull && docker compose -f docker-compose.image.yml up -d

services:
  funtabs:
    # 镜像地址由 .env 里的 IMAGE 提供，未设置会直接报错而不是误拉 Docker Hub
    image: ${IMAGE:?请设置 IMAGE=镜像地址，例如 docker.io/<用户名>/xtab:latest}
    container_name: funtabs
    restart: unless-stopped
    # 每次 up 都拉取最新镜像，保证 git pull 后能拿到新版本
    pull_policy: always
    ports:
      # Lucky 跑在宿主机（host 网络）时，用下面这行只监听本机，避免绕过反代直连
      # - "127.0.0.1:8099:8099"
      # Lucky 跑在 Docker bridge 网络时，用容器名互通，可不加 ports 或保留下面这行
      - "8099:8099"
    environment:
      - PORT=8099
      - DATA_DIR=/app/data
      # 公网访问必填：与网页「自托管设置」里填的一致
      # 生成方式：openssl rand -hex 32
      - API_TOKEN=
      # 前面挂了群晖反向代理 / nginx / Cloudflare Tunnel 时必须设为 1，
      # 否则限流会把所有请求当成同一个 IP 而误伤
      - TRUST_PROXY=0
      # 单 IP 每 5 分钟请求上限，0 表示不限
      - RATE_LIMIT=600
    volumes:
      # 所有数据都在这个目录里，备份就是把整个 data 目录打包
      - ./data:/app/data
