<!DOCTYPE html>
<html>
	<!-- 已移除原项目的百度统计脚本：自托管场景下不应把访问数据上报第三方，且该内联脚本违反 MV3 CSP -->
	<script>
		const title = window.localStorage.getItem("webTitle");
		try {
			title ? (document.title = title) : (document.title = "Xtab");
		} catch (error) {
			document.title = "Xtab";
		}
	</script>

	<head>
		<title>Xtab</title>
		<meta charset="utf-8" />
		<meta
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
			name="viewport"
		/>
		<meta content="yes" name="apple-mobile-web-app-capable" />
		<meta
			name="theme-color"
			content="#ffffff"
			media="(prefers-color-scheme: light)"
		/>
		<meta
			name="theme-color"
			content="#535453"
			media="(prefers-color-scheme: dark)"
		/>
		<meta
			name="description"
			content="Xtab 标签页、网址导航，美化您的浏览器主页与 newtab 新标签页。数据全部保存在您自己的服务器上，支持离线使用。"
		/>
		<link rel="icon" href="./icons/logo.png" />
		<link rel="apple-touch-icon" href="./icons/logo.png" />
		<link rel="manifest" href="./manifest.json" />
		<meta
			name="keywords"
			content="网址导航、方格桌面、Xtab、主页、新标签页、起始页、自定义、工具栏、小组件、自托管"
		/>
	</head>

	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>
	</body>
</html>
